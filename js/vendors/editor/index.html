<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="trumbowyg.css">
</head>
<body>
        <div name="trumbowyg-demo" id="trumbowyg-demo" cols="30" rows="10"></div>
        <button onclick="add()">Add Content</button>
        <button onclick="get()">Get Content</button>
    <script src="jquery.js"></script>
<script src="dist/trumbowyg.js"></script>
<script>
 $(document).ready(function(){
    $('#trumbowyg-demo').trumbowyg({
    btns: [
        ['viewHTML'],
        ['undo', 'redo'], // Only supported in Blink browsers
        ['formatting'],
        ['strong', 'em', 'del'],
        ['superscript', 'subscript'],
        ['link'],
        ['insertImage'],
        ['justifyLeft', 'justifyCenter', 'justifyRight', 'justifyFull'],
        ['unorderedList', 'orderedList'],
        ['horizontalRule'],
        ['removeformat'],
        ['fullscreen']
    ]
});
 })

function add(){
    $("#trumbowyg-demo").append("Hello")
}

function get(){
    alert($("#trumbowyg-demo").html())
}
</script>
</body>
</html>
